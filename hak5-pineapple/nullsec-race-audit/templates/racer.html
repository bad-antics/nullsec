<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>{{ APP_NAME }}</title>
    <style>
        :root {
            --bg: #0a0a0a; --surface: #111; --surface2: #1a1a1a;
            --border: #222; --text: #c8c8c8; --dim: #666;
            --green: #00ff88; --red: #ff4444; --orange: #ff8800;
            --yellow: #ffcc00; --cyan: #00ccff; --purple: #aa44ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 14px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        .header { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .header h1 { color: var(--red); font-size: 24px; }
        .header .version { color: var(--dim); font-size: 12px; }
        .nav-links { margin-left: auto; display: flex; gap: 12px; }
        .nav-links a { color: var(--cyan); text-decoration: none; font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; }
        .nav-links a:hover { border-color: var(--cyan); }

        /* Target input */
        .target-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 24px; }
        .target-panel h2 { color: var(--red); font-size: 16px; margin-bottom: 16px; }
        .target-row { display: flex; gap: 12px; }
        .target-input { flex: 1; padding: 10px 14px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 13px; }
        .target-input:focus { outline: none; border-color: var(--red); }
        .btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 13px; }
        .btn-audit { background: var(--red); color: #fff; }
        .btn-audit:hover { filter: brightness(1.2); }
        .btn-audit:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Probes grid */
        .probes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .probe-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; transition: border-color 0.2s; }
        .probe-card:hover { border-color: var(--red); }
        .probe-card.selected { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
        .probe-card.running { border-color: var(--yellow); animation: borderPulse 1.5s infinite; }
        .probe-card .probe-name { color: var(--red); font-size: 14px; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .probe-card .probe-desc { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
        .probe-card .probe-risk { font-size: 11px; color: var(--orange); }
        .probe-card .severity-range { font-size: 11px; color: var(--dim); }
        .probe-card .result-badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; display: none; }
        .probe-card .result-badge.visible { display: inline-block; }
        @keyframes borderPulse { 0%, 100% { border-color: var(--yellow); } 50% { border-color: var(--border); } }

        /* Progress */
        .progress-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 24px; display: none; }
        .progress-panel.visible { display: block; }
        .progress-log { font-size: 12px; color: var(--dim); max-height: 200px; overflow-y: auto; }
        .progress-log .entry { padding: 3px 0; border-bottom: 1px solid #1a1a1a; }
        .progress-log .entry.finding { color: var(--orange); }
        .progress-log .entry.error { color: var(--red); }

        /* Report */
        .report { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 24px; display: none; }
        .report.visible { display: block; }
        .report h3 { color: var(--red); margin-bottom: 16px; }
        .report-summary { display: flex; gap: 20px; margin-bottom: 20px; font-size: 13px; }
        .report-summary .stat { text-align: center; }
        .report-summary .stat .val { font-size: 24px; font-weight: bold; }
        .report-summary .stat .label { font-size: 11px; color: var(--dim); }

        .finding-card { background: var(--bg); border-left: 3px solid var(--dim); border-radius: 6px; padding: 16px; margin-bottom: 12px; }
        .finding-card.critical { border-left-color: var(--red); }
        .finding-card.high { border-left-color: var(--orange); }
        .finding-card.medium { border-left-color: var(--yellow); }
        .finding-card.low { border-left-color: var(--cyan); }
        .finding-card.info { border-left-color: var(--dim); }
        .finding-title { font-weight: bold; margin-bottom: 6px; }
        .finding-desc { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
        .finding-meta { display: flex; gap: 12px; font-size: 11px; }
        .finding-meta .sev { padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .finding-meta .sev.critical { background: rgba(255,68,68,0.2); color: var(--red); }
        .finding-meta .sev.high { background: rgba(255,136,0,0.2); color: var(--orange); }
        .finding-meta .sev.medium { background: rgba(255,204,0,0.2); color: var(--yellow); }
        .finding-meta .sev.low { background: rgba(0,204,255,0.2); color: var(--cyan); }
        .finding-meta .sev.info { background: rgba(102,102,102,0.2); color: var(--dim); }

        .repro-steps { font-size: 11px; color: var(--dim); margin-top: 8px; padding: 8px; background: var(--surface2); border-radius: 4px; }
        .repro-steps li { padding: 2px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ {{ APP_NAME }}</h1>
            <span class="version">v{{ APP_VERSION }}</span>
            <div class="nav-links">
                <a href="http://localhost:9000">Hub</a>
                <a href="http://localhost:9001">Monitor</a>
                <a href="http://localhost:9004">Armor</a>
            </div>
        </div>

        <div class="target-panel">
            <h2>🎯 Target AI Endpoint</h2>
            <div class="target-row">
                <input type="text" class="target-input" id="targetUrl" placeholder="http://localhost:8000" value="http://localhost:8000">
                <button class="btn btn-audit" id="btnAudit" onclick="runAudit()">🔥 Run Full Audit</button>
            </div>
        </div>

        <h3 style="color: var(--text); margin-bottom: 12px; font-size: 14px;">Race Condition Probes</h3>
        <div class="probes-grid">
            {% for key, probe in probes.items() %}
            <div class="probe-card" id="probe-{{ key }}" data-probe="{{ key }}" onclick="toggleProbe('{{ key }}')">
                <div class="probe-name">
                    <span>{{ probe.name }}</span>
                    <span class="result-badge" id="badge-{{ key }}"></span>
                </div>
                <div class="probe-desc">{{ probe.description }}</div>
                <div class="probe-risk">⚠ {{ probe.risk }}</div>
                <div class="severity-range">Severity: {{ probe.severity_range }}</div>
            </div>
            {% endfor %}
        </div>

        <div class="progress-panel" id="progressPanel">
            <div style="color: var(--yellow); font-size: 13px; margin-bottom: 8px;">⏳ Audit in progress...</div>
            <div class="progress-log" id="progressLog"></div>
        </div>

        <div class="report" id="reportPanel">
            <h3>📋 Audit Report</h3>
            <div class="report-summary" id="reportSummary"></div>
            <div id="findingsContainer"></div>
        </div>
    </div>

    <script>
        let ws = null, selectedProbes = new Set(Object.keys({{ probes | tojson }}));

        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws`);
            ws.onclose = () => setTimeout(connectWS, 3000);
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'audit_start') {
                    document.getElementById('progressPanel').classList.add('visible');
                    addLog(`Auditing ${data.target} with ${data.probes.length} probes...`);
                }
                if (data.type === 'probe_start') addLog(`Running: ${data.probe}...`);
                if (data.type === 'audit_complete') showReport(data.result);
            };
        }
        connectWS();

        function toggleProbe(name) {
            const card = document.getElementById(`probe-${name}`);
            if (selectedProbes.has(name)) { selectedProbes.delete(name); card.classList.remove('selected'); }
            else { selectedProbes.add(name); card.classList.add('selected'); }
        }

        // Select all by default
        document.querySelectorAll('.probe-card').forEach(c => c.classList.add('selected'));

        async function runAudit() {
            const target = document.getElementById('targetUrl').value.trim();
            if (!target) return;

            const btn = document.getElementById('btnAudit');
            btn.disabled = true; btn.textContent = '⏳ Running...';
            document.getElementById('progressLog').innerHTML = '';
            document.getElementById('progressPanel').classList.add('visible');
            document.getElementById('reportPanel').classList.remove('visible');

            try {
                const resp = await fetch('/api/audit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({target, probes: [...selectedProbes]}),
                });
                const result = await resp.json();
                showReport(result);
            } catch(e) {
                addLog(`Error: ${e.message}`, 'error');
            } finally {
                btn.disabled = false; btn.textContent = '🔥 Run Full Audit';
            }
        }

        function addLog(msg, cls = '') {
            const log = document.getElementById('progressLog');
            const entry = document.createElement('div');
            entry.className = `entry ${cls}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function showReport(report) {
            document.getElementById('reportPanel').classList.add('visible');
            document.getElementById('progressPanel').classList.remove('visible');

            const findings = report.findings || [];
            const sevCounts = {critical: 0, high: 0, medium: 0, low: 0, info: 0};
            findings.forEach(f => { if (f.severity in sevCounts) sevCounts[f.severity]++; });

            document.getElementById('reportSummary').innerHTML = `
                <div class="stat"><div class="val" style="color:var(--text)">${report.probes_run}</div><div class="label">PROBES</div></div>
                <div class="stat"><div class="val" style="color:var(--text)">${report.total_requests}</div><div class="label">REQUESTS</div></div>
                <div class="stat"><div class="val" style="color:var(--text)">${report.duration_sec}s</div><div class="label">DURATION</div></div>
                <div class="stat"><div class="val" style="color:var(--red)">${sevCounts.critical}</div><div class="label">CRITICAL</div></div>
                <div class="stat"><div class="val" style="color:var(--orange)">${sevCounts.high}</div><div class="label">HIGH</div></div>
                <div class="stat"><div class="val" style="color:var(--yellow)">${sevCounts.medium}</div><div class="label">MEDIUM</div></div>
                <div class="stat"><div class="val" style="color:var(--cyan)">${sevCounts.low}</div><div class="label">LOW</div></div>
            `;

            const container = document.getElementById('findingsContainer');
            container.innerHTML = findings.map(f => `
                <div class="finding-card ${f.severity}">
                    <div class="finding-title">${f.title}</div>
                    <div class="finding-desc">${f.description}</div>
                    <div class="finding-meta">
                        <span class="sev ${f.severity}">${f.severity.toUpperCase()}</span>
                        <span style="color:var(--dim)">${f.requests_sent} requests</span>
                        <span style="color:var(--dim)">${f.anomalies_found} anomalies</span>
                    </div>
                    ${f.reproduction_steps?.length ? `
                        <div class="repro-steps">
                            <strong>Reproduction:</strong>
                            <ol>${f.reproduction_steps.map(s => `<li>${s}</li>`).join('')}</ol>
                        </div>
                    ` : ''}
                </div>
            `).join('');

            // Update probe cards with results
            findings.forEach(f => {
                const badge = document.getElementById(`badge-${f.race_type}`);
                if (badge) {
                    badge.textContent = f.severity.toUpperCase();
                    badge.style.cssText = `display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px;` +
                        (f.severity === 'critical' ? 'background:rgba(255,68,68,0.2);color:var(--red);' :
                         f.severity === 'high' ? 'background:rgba(255,136,0,0.2);color:var(--orange);' :
                         f.severity === 'medium' ? 'background:rgba(255,204,0,0.2);color:var(--yellow);' :
                         'background:rgba(102,102,102,0.2);color:var(--dim);');
                }
            });
        }
    </script>
</body>
</html>
